<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escalas CR - Gestão de Coletas por HUB</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando "flash" claro
      (function () {
        try {
          if (localStorage.getItem('escalas-cr:tema') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
